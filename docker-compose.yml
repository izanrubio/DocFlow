services:
  php-fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      network: host
    container_name: docflow-php
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - docflow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PHP_OPCACHE_ENABLE=0
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: docflow-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - docflow
    depends_on:
      - php-fpm

  mysql:
    image: mysql:8.0
    container_name: docflow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docflow
      MYSQL_USER: docflow
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - docflow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "docflow", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: docflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docflow

  minio:
    image: minio/minio
    container_name: docflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: docflow
      MINIO_ROOT_PASSWORD: secret123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - docflow

  minio-setup:
    image: minio/mc
    container_name: docflow-minio-setup
    depends_on:
      - minio
    networks:
      - docflow
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 docflow secret123;
      mc mb local/docflow-documents --ignore-existing;
      mc anonymous set none local/docflow-documents;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit
    container_name: docflow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - docflow

  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      network: host
    container_name: docflow-horizon
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    networks:
      - docflow
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      network: host
    container_name: docflow-scheduler
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    networks:
      - docflow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  docflow:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
